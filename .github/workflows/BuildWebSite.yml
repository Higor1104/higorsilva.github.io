name: Build and Deploy Vue.js App

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed to push

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # Use the version your project requires

      - name: Install dependencies
        run: npm ci

      - name: Build Vue app
        run: npm run build

      - name: Commit built files in root (excluding ignored ones)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add all untracked or changed files (excluding those in .gitignore like node_modules)
          git add -u
          git add .

          # Check for any actual changes
          if ! git diff --cached --quiet; then
            git commit -m "Build: update root files [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
